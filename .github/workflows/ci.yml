name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
          - runner: macos-14
    steps:
      - uses: actions/checkout@v4
      # Runner images ship multiple Xcodes; pin so swiftc behavior stays stable.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Run test suite (compiles daemon module, runs assertions, type-checks entry point)
        run: ./tests/run.sh

  lint:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck installer
        run: shellcheck --severity=warning bin/meeting-capture-install
